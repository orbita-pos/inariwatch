<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0a0a0c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f97316" opacity="0.9">
    <text x="40" y="80" font-size="14" fill="#71717a">user.ts · offline</text>
    <text x="40" y="160" font-size="20" fill="#a1a1aa">function normalizeUser(user: User) {</text>
    <text x="60" y="200" font-size="20" fill="#10b981">+ return user?.email?.toLowerCase().trim();</text>
    <text x="40" y="240" font-size="20" fill="#a1a1aa">}</text>
    <text x="40" y="320" font-size="14" fill="#71717a">Tab → instant suggestion · Local model · No cloud</text>
  </g>
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <circle cx="20" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="40" cy="0" r="6" fill="#10b981"/>
  </g>
</svg>
