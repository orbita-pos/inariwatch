# Kamal 2 deploy configuration for InariWatch web.
#
# Commands:
#   kamal setup          — first-time bootstrap (installs kamal-proxy, pulls image, starts containers)
#   kamal deploy         — normal deploy (build, push, swap, gapless)
#   kamal app logs -f    — tail the running container
#   kamal app rollback   — revert to the previous healthy version
#   kamal app exec -i bash  — shell into the container
#
# Secrets are loaded from .kamal/secrets which in turn pulls decrypted
# values from .env.sops.yaml via the sops CLI. See .sops.yaml for the age
# encryption rule.

service: inari-web

# GitHub Container Registry
image: orbita-pos/inari-web

# Physical hosts. Add a second server here when we're ready for HA.
servers:
  web:
    hosts:
      - 87.99.153.227  # inari-web CPX21, Ashburn
    labels:
      app.role: web
    # Allow the Next.js container to reach services running on the host
    # (ops-agent at :9500, any future host-local sidecars). With Kamal the
    # Docker default bridge is used; `host.docker.internal:host-gateway`
    # is the standard --add-host recipe for Linux parity with Mac/Windows
    # Docker Desktop.
    #
    # Hardening (2026-04-19):
    #   - security-opt no-new-privileges: blocks setuid-like privilege
    #     escalation inside the container (e.g., sudo, suid binaries).
    #   - cap-drop ALL + minimal cap-add: start from zero capabilities and
    #     add only what Node.js/Next.js genuinely needs. This closes most
    #     container-escape primitives (MKNOD, NET_RAW, AUDIT_WRITE, etc.).
    options:
      add-host: host.docker.internal:host-gateway
      security-opt: [ "no-new-privileges:true" ]
      cap-drop: [ "ALL" ]
      cap-add: [ "CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "NET_BIND_SERVICE" ]

# Kamal 2 ships a built-in proxy (kamal-proxy) that handles TLS termination,
# zero-downtime swaps, and Let's Encrypt on its own. Replaces the separate
# Traefik/Caddy stanza that Kamal 1 required.
#
# All 7 production hostnames for the web app live on this box now:
#   - inariwatch.com           (apex, marketing landing)
#   - www.inariwatch.com       (marketing)
#   - app.inariwatch.com       (dashboard)
#   - mcp.inariwatch.com       (MCP server, same Next.js via middleware rewrite)
#   - install.inariwatch.com   (agent installer page)
#   - status.inariwatch.com    (public status page)
#   - get.inariwatch.com       (downloads / landing alias)
#
proxy:
  ssl: true
  hosts:
    - inariwatch.com
    - www.inariwatch.com
    - app.inariwatch.com
    - mcp.inariwatch.com
    - install.inariwatch.com
    - status.inariwatch.com
    - get.inariwatch.com
  app_port: 3000
  healthcheck:
    path: /api/health
    interval: 5
    timeout: 3
  # NOTE: SSE streaming — kamal-proxy in 2.x doesn't buffer responses by
  # default for `Content-Type: text/event-stream`, so /api/remediation/stream
  # and friends work out of the box. If we hit buffering issues during
  # parallel run, we tune via kamal-proxy env vars rather than deploy.yml.

# Registry auth (GHCR). KAMAL_REGISTRY_PASSWORD comes from .kamal/secrets,
# which decrypts from .env.sops.yaml at deploy time.
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# Docker buildx — registry cache keeps subsequent builds at ~90s even after
# a full Dockerfile change. mode=max caches intermediate stages too
# (critical for the deps + build split).
builder:
  arch: amd64
  cache:
    type: registry
    image: orbita-pos/inari-web-build-cache
    options: mode=max,compression=zstd
  # Pass the build arg through so /api/health can expose the git sha.
  args:
    APP_VERSION: ""  # set by CI to $GITHUB_SHA

# Runtime environment variables. `clear` values are plaintext (non-secret),
# `secret` values reference keys in .kamal/secrets.
env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    NEXT_TELEMETRY_DISABLED: "1"
    # Canonical app URL. NEXTAUTH_URL drives OAuth callback composition +
    # post-login redirects, APP_URL drives all server-generated absolute
    # links (emails, OG images, share URLs). Both point at app.* now that
    # we're about to flip DNS to Hetzner — before the flip kamal-proxy
    # still serves requests that arrive via --resolve, after the flip
    # real traffic lands here.
    APP_URL: "https://app.inariwatch.com"
    NEXTAUTH_URL: "https://app.inariwatch.com"
    # Hetzner-local Redis (cache + rate-limit + dedup). The accessory below
    # binds to the kamal-network bridge gateway, reachable only from the
    # `kamal` Docker network. lib/redis.ts uses these vars + REDIS_PASSWORD
    # secret to construct the ioredis client. Per-call DB fallback in
    # callers handles Redis-down (Postgres slower but functional).
    REDIS_HOST: "172.18.0.1"
    REDIS_PORT: "6379"
  secret:
    # Core
    - DATABASE_URL
    - NEXTAUTH_SECRET
    - ENCRYPTION_KEY
    - CRON_SECRET
    - ADMIN_EMAIL
    # Integrations
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - SLACK_CLIENT_ID
    - SLACK_CLIENT_SECRET
    - SLACK_SIGNING_SECRET
    # TODO: re-enable once the value is added via `scripts/update-sops-key.ts
    # TELEGRAM_WEBHOOK_SECRET`. Until then, Telegram inbound webhook is
    # unverified — the /api/telegram/webhook route rejects all requests.
    # - TELEGRAM_WEBHOOK_SECRET
    # AI
    - PLATFORM_AI_KEY
    - PLATFORM_ANTHROPIC_KEY
    # Infra — Hetzner-local Redis. Auth password for the accessory below
    # (kamal-network bridge gateway 172.18.0.1:6379). Migrated off Upstash
    # 2026-04-19; UPSTASH_* and the dual-backend abstraction were removed
    # after 2k+ commands ran clean over the local Redis.
    - REDIS_PASSWORD
    - R2_ACCOUNT_ID
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_BUCKET
    # Hetzner-side services
    - STAGING_SERVER_URL
    - STAGING_API_SECRET
    - WORKER_URL
    - EAP_SERVER_URL
    - EAP_API_KEY
    # Email + push
    # Transactional email (signup verify, password reset, digests) uses
    # nodemailer against Resend's SMTP relay — see lib/notifications/email.ts.
    # All 6 SMTP_* vars are already in sops.
    - SMTP_HOST
    - SMTP_PORT
    - SMTP_SECURE
    - SMTP_USER
    - SMTP_PASS
    - SMTP_FROM
    # RESEND_API_KEY is only used by the public status-page subscriber
    # pipeline (lib/ai/status-page-automation.ts). Not set historically;
    # the status-page subscribe flow silently skips when absent.
    # - RESEND_API_KEY
    - VAPID_PRIVATE_KEY
    - VAPID_EMAIL
    # Feature flags
    - PREVIEW_FIX_ORGS
    - PREVIEW_FIX_USERS
    - REPLAY_V2_ORGS
    # /admin/ops dashboard → ops-agent on each box + GH Actions API for deploys widget
    - OPS_AGENT_SECRET
    - OPS_URL_STAGING
    - OPS_URL_WEB
    - OPS_GITHUB_TOKEN
    # Web Push (public key is baked in at build time above)

# SSH access to the Hetzner host. Kamal uses the user's SSH agent — add your
# private key with `ssh-add` before running `kamal deploy`, or rely on the
# GitHub Actions workflow which loads HETZNER_DEPLOY_KEY into ssh-agent.
#
# Do NOT set `keys_only: true` — Net::SSH interprets that as "only use keys
# from the explicit `keys:` list" and then ignores the ssh-agent entirely.
# Without an explicit key path (we rely on ssh-agent in CI), it falls
# through to password auth, which tries to prompt on stdin via `noecho`
# and dies with ENOTTY in a CI environment with no TTY.
ssh:
  user: root

# Hetzner-local Redis for the web app: rate limiting, AI cache, alert dedup,
# Slack token cache, email rate limit. Replaces Upstash REST after parallel
# run. Bound to the kamal-network bridge gateway (172.18.0.1) so it is
# reachable from any container on the `kamal` Docker network and nothing
# else — never exposed on a public interface even if UFW is misconfigured.
# `requirepass` covers the residual case of a compromised neighbour container
# on the same Docker network. Persistence: AOF on, 256MB LRU cap (cache
# only, not a datastore — DB fallback paths in lib/redis.ts cover any data
# loss). Hardening matches the web container: no-new-privileges + cap-drop
# ALL. Boot via `kamal accessory boot redis` once REDIS_PASSWORD is in sops.
accessories:
  redis:
    image: redis:7-alpine
    host: 87.99.153.227
    port: "172.18.0.1:6379:6379"
    volumes:
      - /var/lib/inari-web-redis:/data
    env:
      secret:
        - REDIS_PASSWORD
    options:
      # `restart` is intentionally omitted — Kamal manages it itself
      # (defaults to `unless-stopped` for accessories) and rejects an
      # override here at config-validation time.
      #
      # uid 999 = baked-in `redis` user in redis:7-alpine. Required because
      # cap-drop ALL removes CAP_DAC_OVERRIDE, so even container-root cannot
      # write to /data unless it owns the dir. /var/lib/inari-web-redis on
      # the host is chowned to 999:999 by scripts/boot-redis-accessory.sh.
      user: "999:999"
      security-opt: [ "no-new-privileges:true" ]
      cap-drop: [ "ALL" ]
    cmd: >-
      sh -c 'exec redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass "$REDIS_PASSWORD"'

# Logging — kamal logs tails Docker's json-file driver. For long-term logs,
# pipe to Grafana Loki or similar post-cutover.
logging:
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
