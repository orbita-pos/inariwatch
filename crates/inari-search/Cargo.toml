[package]
name        = "inari-search"
version     = "0.1.0"
edition     = "2021"
description = "Inari Live S13 — zero-friction local search for Capture errors. Online tier (Stack Overflow + GitHub Issues + MDN) over anonymous per-IP quotas + SQLite cache. No baked keys, no signups."
publish     = false

# v0.3 S13 — standalone crate consumed via `path =` from
# desktop/src-tauri/. Mirrors the workspace layout chosen for
# crates/ai-router-rs/: there is no Cargo workspace root in this repo
# (desktop/src-tauri/ runs its own tauri-cli + Cargo.lock), so each
# Rust crate that ships from `crates/<name>/` is published into the
# binary as a path-dep. See `crates/ai-router-rs/Cargo.toml` for the
# rationale.

[lib]
name = "inari_search"
path = "src/lib.rs"

# Same `test-utils` pattern the desktop crate uses for `agent-test-utils` —
# off by default; integration tests opt in. Exposes `Searcher::cache_for_tests`
# and `Cache::debug_age_row` so harnesses can drive synthetic cache state
# without round-tripping through the live HTTP path. Production builds keep
# both helpers behind the cfg.
[features]
default    = []
test-utils = []

# `searcher` integration suite needs `cache_for_tests` — opt-in via
# `--features test-utils` so a plain `cargo test` of just the unit tier
# still succeeds (and the feature gate stays honest in prod).
[[test]]
name              = "searcher"
path              = "tests/searcher.rs"
required-features = ["test-utils"]

[dependencies]
# Async runtime — same versions as ai-router-rs and desktop/src-tauri/
# so the shared CARGO_TARGET_DIR cache stays warm across builds.
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# `rustls-tls` (not openssl) so Windows builds don't depend on a system
# OpenSSL install. `gzip` keeps SO/GH responses compact (both endpoints
# advertise it). `json` saves us a serde call per response.
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
async-trait  = "0.1"
thiserror    = "1"
tracing      = "0.1"
url          = { version = "2", features = ["serde"] }
# `bundled` ships SQLite source — no external libsqlite3 install needed
# on Windows or anywhere else. We keep `load_extension` off (we don't
# need vec / FTS5 here, just a content-addressed key-value cache).
rusqlite     = { version = "0.31", features = ["bundled"] }
sha2         = "0.10"
regex        = "1"
once_cell    = "1"
# Polite percent-encoding for query-string values — pulled in instead
# of hand-rolling because crates.io / GH escape rules differ subtly.
urlencoding  = "2"
futures-util = "0.3"

[dev-dependencies]
tokio    = { version = "1", features = ["full", "test-util", "macros"] }
# Same fixture stack as the rest of the repo — see desktop/src-tauri/Cargo.toml.
mockito  = "1"
tempfile = "3"
