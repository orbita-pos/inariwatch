name: Deploy web to Hetzner

# Triggers on merged changes that affect the web app or the deploy workflow
# itself. Changes to /worker, /cli, /docs, etc. do NOT rebuild — the path
# filter is the first line of defense against burning CI minutes on
# irrelevant commits.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a manual deploy'
        required: true
        default: 'deploy'

concurrency:
  # Only one deploy in flight at a time. If a second push lands while a
  # deploy is running, cancel the newer one — Kamal's gapless swap means
  # the older deploy will pick up the latest main commit on its next run.
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cap at 25 minutes — Kamal setup + push + swap should finish in ~3min
    # on a warm cache. Anything over 25m means something is wedged.
    timeout-minutes: 25

    permissions:
      contents: read
      packages: write  # push image to GHCR
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby (for Kamal)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Kamal
        run: gem install kamal -v '~> 2.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.16.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_DEPLOY_KEY }}

      - name: Add Hetzner host key to known_hosts
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_WEB_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Write age private key
        env:
          AGE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.config/sops/age
          printf '%s\n' "$AGE_KEY" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops \
            https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          sops --version

      - name: Prepare Kamal secrets file
        working-directory: web
        env:
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp .kamal/secrets.template .kamal/secrets
          chmod 600 .kamal/secrets

      - name: Deploy
        working-directory: web
        env:
          # Passed to Docker as ARG so /api/health reports the commit that's
          # actually running in prod.
          DOCKER_BUILDKIT: '1'
          APP_VERSION: ${{ github.sha }}
          KAMAL_REGISTRY_USERNAME: ${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SOPS_AGE_KEY_FILE: /home/runner/.config/sops/age/keys.txt
        run: |
          kamal deploy --version "${GITHUB_SHA}" --verbose

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deploy to Hetzner failed — see logs above. Rollback: ssh to host, run 'kamal app rollback'."
