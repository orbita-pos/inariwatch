# Fase 5 — adversarial gate for the CodeAct sandbox.
#
# Runs the full `sandbox-security.test.ts` suite (10 escape vectors from
# REMEDIATION_SYSTEM_ARCHITECTURE.md §Fase 5 + 3 defense-in-depth
# additions) on every PR that touches the sandbox surface or its
# validators. Failing this gate must block merge — the sandbox is the
# only thing standing between model-emitted Python and the worker host.
#
# Pyodide is fetched from npm via `deno cache` once, then the runner is
# exercised against the in-repo pyodide-runner.ts (no /opt/sandbox
# install needed in CI).

name: sandbox-security

on:
  pull_request:
    paths:
      - 'worker/src/sandbox/**'
      - 'worker/src/__tests__/sandbox-security.test.ts'
      - 'worker/src/__tests__/execute-plan.test.ts'
      - 'worker/src/container-agent.ts'
      - 'worker/package.json'
      - '.github/workflows/sandbox-security.yml'
  push:
    branches:
      - main
    paths:
      - 'worker/src/sandbox/**'

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker deps
        working-directory: worker
        run: npm ci || npm install

      # Pin Deno to a 2.x point release. Bumping this version is a
      # security-sensitive change — match the version recorded in
      # worker/src/sandbox/SETUP.md after a CVE review.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Cache Pyodide OUTSIDE the worker directory. Deno 2.x detects the
      # repo's package.json and switches to `nodeModules: manual`, which
      # rejects bare `deno cache npm:<x>` entrypoints. Running the cache
      # step in a fresh directory with its own DENO_DIR bypasses that —
      # the Pyodide bits land in /tmp/sandbox-cache and the test run
      # reads them by pointing DENO_DIR at the same place.
      - name: Pre-cache Pyodide
        run: |
          mkdir -p /tmp/sandbox-cache
          cd /tmp/sandbox-cache
          # --node-modules-dir=auto matches what runner.ts passes to the
          # Deno subprocess at runtime, so the cache layout written here
          # is the one Pyodide expects to find when imported.
          DENO_DIR=/tmp/sandbox-cache deno cache --node-modules-dir=auto npm:pyodide@0.28

      - name: TypeCheck
        working-directory: worker
        run: npx tsc --noEmit

      - name: Adversarial sandbox tests
        working-directory: worker
        env:
          # Point the runner at the in-repo file; SETUP.md describes the
          # production /opt/sandbox layout.
          SANDBOX_RUNNER_PATH: ${{ github.workspace }}/worker/src/sandbox/pyodide-runner.ts
          SANDBOX_READ_ROOT: ${{ github.workspace }}/worker/src/sandbox
          # The subprocess spawn in runner.ts forwards DENO_DIR to the
          # Deno child, so Pyodide resolves from the pre-cache above
          # instead of hitting npm at test time.
          SANDBOX_DENO_DIR: /tmp/sandbox-cache
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npx tsx --test src/__tests__/sandbox-security.test.ts

      - name: execute_plan gating tests
        working-directory: worker
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: npx tsx --test src/__tests__/execute-plan.test.ts
