[package]
name    = "inariwatch-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name       = "inariwatch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inariwatch-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                    = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater     = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart   = "2"
tauri-plugin-dialog      = "2"
tauri-plugin-global-shortcut = "2"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
tokio                    = { version = "1", features = ["full"] }
flume                    = "0.11"
tracing                  = "0.1"
tracing-subscriber       = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender         = "0.2"
reqwest                  = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
dirs                     = "5"
toml                     = "0.8"
notify                   = "6"
sha2                     = "0.10"
regex                    = "1"
once_cell                = "1"
futures-util             = "0.3"

# Session 3 — local store. rusqlite over sqlx because sqlx does not expose
# LOAD EXTENSION (we need it for sqlite-vec). r2d2 + r2d2_sqlite for the
# pool — rusqlite::Connection is !Sync. sqlite-vec ships its FFI as static
# C source; loaded via auto_extension at pool init (see store/pool.rs).
rusqlite                 = { version = "0.31", features = ["bundled", "load_extension"] }
r2d2                     = "0.8"
r2d2_sqlite              = { version = "0.24", features = ["bundled"] }
sqlite-vec               = "0.1"
thiserror                = "1"

[dev-dependencies]
tokio                    = { version = "1", features = ["full", "test-util"] }
tempfile                 = "3"
