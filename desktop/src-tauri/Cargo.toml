[package]
name    = "inariwatch-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name       = "inariwatch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "inariwatch-desktop"
path = "src/main.rs"

# Session 7 — sidecar binary that Claude Code / Codex / Cursor / Zed
# spawn over stdio. It is a CLIENT of the daemon's local HTTP MCP
# transport, not a second instance of the server. Reads JSON-RPC frames
# from stdin, forwards over `127.0.0.1:<mcp_port>` (HTTP + Bearer), and
# writes responses back to stdout.
[[bin]]
name = "inari-mcp-stdio"
path = "src/bin/inari_mcp_stdio.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                    = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater     = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart   = "2"
tauri-plugin-dialog      = "2"
tauri-plugin-global-shortcut = "2"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
tokio                    = { version = "1", features = ["full"] }
flume                    = "0.11"
tracing                  = "0.1"
tracing-subscriber       = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender         = "0.2"
reqwest                  = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"], default-features = false }
dirs                     = "5"
toml                     = "0.8"
notify                   = "6"
sha2                     = "0.10"
regex                    = "1"
once_cell                = "1"
futures-util             = "0.3"

# Session 3 — local store. rusqlite over sqlx because sqlx does not expose
# LOAD EXTENSION (we need it for sqlite-vec). r2d2 + r2d2_sqlite for the
# pool — rusqlite::Connection is !Sync. sqlite-vec ships its FFI as static
# C source; loaded via auto_extension at pool init (see store/pool.rs).
rusqlite                 = { version = "0.31", features = ["bundled", "load_extension"] }
r2d2                     = "0.8"
r2d2_sqlite              = { version = "0.24", features = ["bundled"] }
sqlite-vec               = "0.1"
thiserror                = "1"

# Session 4 — IPC bridge. ts-rs auto-generates TypeScript types for the
# DTOs returned by Tauri commands so the frontend wrapper at
# desktop/src/lib/types/ stays in sync at compile time. The `serde-json-impl`
# feature enables `serde_json::Value` mapping. ts-rs's own `export_bindings_*`
# lib tests refresh the .ts files on every `cargo test --lib` — no manual
# regenerator test needed.
ts-rs                    = { version = "8", features = ["serde-json-impl"] }

# Session 7 — local MCP server. axum hosts JSON-RPC 2.0 over HTTP on
# 127.0.0.1:<mcp_port>. tower / tower-http are already transitive
# (reqwest pulls them) but Cargo recommends declaring them explicitly
# when we use axum's middleware. uuid is used to generate the Bearer
# token persisted at first launch.
axum                     = { version = "0.7", features = ["json", "tokio"] }
tower                    = "0.5"
tower-http               = { version = "0.5", features = ["trace", "cors"] }
uuid                     = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio                    = { version = "1", features = ["full", "test-util"] }
tempfile                 = "3"
# Session 7 — integration tests fire HTTP requests at the running
# axum router. reqwest already declared as a runtime dep above; the
# JSON feature is enough.
